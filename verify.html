<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Verification Portal · PharmaTrace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header id="nav"></header>
  <main class="pt-wrap">
    <div class="pt-head">
      <div>
        <p class="pt-eyebrow">Pharmacist</p>
        <h1>Verify before dispensing</h1>
        <p id="atLine">Scan the QR on the pack or type the 12-digit Batch ID.</p>
      </div>
    </div>

    <section class="pt-panel pt-panel__body d-grid gap-3" aria-label="Batch search">
      <form class="pt-search" id="searchForm" novalidate>
        <label class="visually-hidden" for="batchInput">Batch ID</label>
        <input class="form-control" id="batchInput" inputmode="numeric" autocomplete="off" placeholder="0000 0000 0000" maxlength="14">
        <button class="btn btn-primary" type="submit">Verify</button>
        <button class="btn btn-outline-primary" type="button" id="scanBtn">Scan QR</button>
      </form>
      <div id="result">
        <div class="pt-empty">
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="38" y="6" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="6" y="38" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><path d="M38 38h8v8h-8zM50 50h8v8h-8zM50 38h8M38 58h8" stroke="currentColor" stroke-width="3" fill="none"/></svg>
          <p>Enter a 12-digit Batch ID to begin tracing. Try <button type="button" class="btn btn-link p-0 align-baseline" data-try="100000000001">1000 0000 0001</button> or <button type="button" class="btn btn-link p-0 align-baseline" data-try="100000000002">1000 0000 0002</button>.</p>
        </div>
      </div>
    </section>

    <section class="pt-panel" aria-labelledby="inTitle">
      <div class="pt-panel__head"><h2 id="inTitle">Deliveries to this pharmacy</h2></div>
      <div class="table-responsive">
        <table class="table pt-table">
          <thead><tr><th>Shipment</th><th>Drug</th><th>From</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="incoming"></tbody>
        </table>
      </div>
    </section>

    <section class="pt-panel" aria-labelledby="stockTitle">
      <div class="pt-panel__head"><h2 id="stockTitle">Stock on your shelves</h2></div>
      <div class="table-responsive">
        <table class="table pt-table table-hover">
          <thead><tr><th>Batch ID</th><th>Drug</th><th>Expiry</th><th>Status</th><th></th></tr></thead>
          <tbody id="stock"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="ledger.js"></script>
  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="actions.js"></script>
  <script src="scanner.js"></script>
  <script src="verify.js"></script>
</body>
</html>
